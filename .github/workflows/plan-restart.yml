name: Plan restart - ten task batches Windows regression
on:
  push:
    branches: ['arena/bbed83d1-zs-music-maker']
    paths:
      - 'docs/plan/**'
      - 'tools/check_plan_restart.py'
      - 'desktop/src/core/product-contract.js'
      - 'desktop/src/sections/help.js'
      - 'desktop/electron/product-help-check.js'
      - 'desktop/electron/window-startup-check.js'
      - 'desktop/test/product-contract.test.js'
      - 'desktop/scripts/product-spec.js'
      - 'app/pipeline/**'
      - 'app/ai/profiles.py'
      - 'app/ai/sequential_runner.py'
      - 'app/core/orchestrator*.py'
      - 'app/core/report_finalize.py'
      - 'app/cli/pipeline.py'
      - 'tests/**'
      - '.github/workflows/plan-restart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-fifty-regression-not-generation:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight contract and stage-test runtime
        run: python -m pip install pytest numpy soundfile requests psutil cloudpickle==3.1.2
      - name: Check complete queue and exact ten-task coverage
        run: |
          python tools/build_product_plan.py --check
          python tools/check_plan_restart.py
          node desktop/scripts/product-spec.js --check
      - name: Ten-task pass positive and negative regressions, no model inference
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & python -m pytest tests/test_plan_restart.py tests/test_product_plan.py tests/test_result_acceptance_contract.py tests/test_task_outcome_contract.py tests/test_pipeline_stage_contract.py tests/test_hardware_profiles_contract.py tests/test_product_maps.py tests/test_runtime_orchestrator_result_summary.py tests/test_orchestrator_adapters.py tests/test_cli_pipeline_handlers.py tests/test_stage_process.py tests/test_function_length_budget.py -q --tb=short --junitxml=restart-tests.xml 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $details = (($output | Select-Object -Last 100) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Ten-task regression::$details"
            exit $code
          }
      - name: Product, creation and navigation contracts
        run: node --test desktop/test/product-contract.test.js desktop/test/creation.test.js desktop/test/ui-contract.test.js
      - name: Read-only real hardware inventory, not accepted model profiles
        run: python tools/measure_hardware_profile.py --out restart-hardware.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-first-fifty-regressions
          path: |
            restart-tests.xml
            restart-hardware.json
          retention-days: 7

  specification-first-ten:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: First ten specification positive and negative regressions
        run: |
          node desktop/scripts/product-spec.js --check
          node --test desktop/test/product-contract.test.js desktop/test/render.test.js desktop/test/ui-contract.test.js
      - name: Install development packaging tools
        working-directory: desktop
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Package real Electron, no publishing
        working-directory: desktop
        run: npm run dist:dir
      - name: Verify actual packaged help text and all four scenarios
        shell: pwsh
        run: |
          $env:ZSMM_WINDOW_CHECK_OUT = Join-Path $env:RUNNER_TEMP 'first-ten-window.json'
          $p = Start-Process -FilePath 'desktop/dist/win-unpacked/ZS Music Maker.exe' -ArgumentList '--window-check' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Specification window timed out' }
          $report = Get-Content $env:ZSMM_WINDOW_CHECK_OUT -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $report.ok -or -not $report.productHelpVerified) {
            throw 'Packaged help does not match the full canonical product contract'
          }
          Write-Output '::notice title=T0001-T0010 specification::Real packaged help text and all four scenario boundaries match canonical contract. Not model generation acceptance.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-ten-specification-window
          path: ${{ runner.temp }}/first-ten-window.json
          retention-days: 7
