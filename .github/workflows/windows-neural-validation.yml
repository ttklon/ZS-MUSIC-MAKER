name: Windows - real neural validation
on:
  push:
    branches: ['arena/bbed83d1-zs-music-maker']
    paths:
      - '.github/workflows/windows-neural-validation.yml'
      - 'tools/windows_neural_smoke.py'
      - 'tools/neural_benchmark.py'
      - 'tools/local_model_benchmark.py'
      - 'tools/pipeline_hardware_probe.py'
      - 'app/core/stage_request.py'
      - 'app/pipeline/outcome.py'
      - 'tests/test_pipeline_hardware_probe.py'
      - 'tests/test_local_model_benchmark.py'
      - 'tools/desktop_render_benchmark.js'
      - 'desktop/test/hardware-benchmark.test.js'
      - 'app/ai/hardware.py'
      - 'app/ai/profiles.py'
      - 'app/ai/registry.py'
      - 'tests/test_ai_registry.py'
      - 'tests/test_ai_hardware_detection.py'
      - 'tests/test_hardware_profiles_contract.py'
      - 'modules/silero_loader.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-silero:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual CPU inference runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 soundfile omegaconf pyyaml requests psutil pytest
      - name: Verify hardware and offline contracts on Windows (mocked model tests, not inference)
        shell: pwsh
        run: |
          python -m pytest tests/test_ai_hardware_detection.py tests/test_adaptive_hardware.py tests/test_ai_registry.py tests/test_hardware_profiles_contract.py tests/test_neural_benchmark.py tests/test_silero_offline.py tests/test_local_model_benchmark.py -q --junitxml=output/windows-neural-smoke/contracts.xml 2>&1 | Tee-Object -FilePath hardware-contracts.log
          $code = $LASTEXITCODE
          $detail = ((Get-Content hardware-contracts.log | Select-Object -Last 15) -join ' | ') -replace '%','%25'
          if ($code -ne 0) { Write-Output "::error title=Hardware regression::$detail" } else { Write-Output "::notice title=Hardware regression::$detail" }
          exit $code
      - name: Download real Silero weights and synthesize online and offline
        shell: pwsh
        run: |
          python tools/windows_neural_smoke.py 2>&1 | Tee-Object -FilePath neural-console.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { $detail = ((Get-Content neural-console.log | Select-Object -Last 15) -join ' | ') -replace '%','%25'; Write-Output "::error title=neural benchmark failure::$detail" }
          exit $code
      - name: Strict offline explicit-backend inference using the actual cached model
        run: >-
          python -c "import subprocess,sys,torch; from modules.silero_loader import _local_package; from tools.neural_benchmark import sha256; p=_local_package(torch,'v3_1_ru'); assert p is not None; subprocess.run([sys.executable,'tools/local_model_benchmark.py','--backend','cpu','--trusted-model',str(p),'--sha256',sha256(p),'--out','output/windows-neural-smoke/strict-cpu'],check=True)"
      - name: Preserve measured report and generated speech
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-real-silero
          path: output/windows-neural-smoke/
          retention-days: 3
          if-no-files-found: warn
  bootstrap-compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify product refuses shared environment mutation
        run: |
          pip install pytest
          python -m pytest tests/test_bootstrap_results.py tests/test_dependency_profiles.py -q
      - name: Verify resolver rejects the known incompatible combination
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run torch==2.5.1 torchaudio==2.5.1 audiocraft==1.3.0 2>&1 | Tee-Object -FilePath bootstrap-resolver.log
          $code = $LASTEXITCODE
          Get-Content bootstrap-resolver.log -Tail 30 | ForEach-Object { Write-Output $_ }
          $log = Get-Content bootstrap-resolver.log -Raw
          if ($code -eq 0 -or $log -notmatch 'ResolutionImpossible' -or $log -notmatch 'audiocraft 1.3.0 depends on torch==2.1.0') { Write-Output '::error::Expected specific AudioCraft/Torch resolver rejection was not observed'; exit 1 }
          Write-Output '::notice title=Expected dependency rejection::Incompatible shared installation rejected; this is NOT a successful AudioCraft installation.'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bootstrap-resolver
          path: bootstrap-resolver.log
          retention-days: 3

  real-desktop-dsp:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seconds: [20, 120]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate benchmark and real worker cancellation/retry
        run: node --test desktop/test/hardware-benchmark.test.js
      - name: Render actual instrumental through production worker
        run: node tools/desktop_render_benchmark.js ${{ matrix.seconds }} output/desktop-dsp-${{ matrix.seconds }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-dsp-${{ matrix.seconds }}
          path: output/desktop-dsp-${{ matrix.seconds }}/
          retention-days: 7
          if-no-files-found: error

  classic-pipeline-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU diagnostic runtime (no neural engines or GUI)
        run: pip install numpy==1.26.4 scipy==1.14.1 librosa==0.10.2.post1 soundfile==0.13.1 pyloudnorm==0.1.1 pyyaml requests psutil mutagen pydub mido pytest
      - name: Verify probe cannot promote a partial master to success
        run: python -m pytest tests/test_pipeline_hardware_probe.py tests/test_classic_request_scope.py tests/test_task_outcome_contract.py -q
      - name: Measure real orchestration and verify expected incomplete outcome (NOT profile acceptance)
        shell: pwsh
        run: |
          python tools/pipeline_hardware_probe.py --duration 20 --out output/classic-hardware-probe 2>&1 | Tee-Object -FilePath classic-probe.log
          $code = $LASTEXITCODE
          if ($code -ne 1) { Write-Output '::error::Expected incomplete pipeline diagnostic exit 1'; exit 1 }
          python -c "import json; r=json.load(open('output/classic-hardware-probe/probe_report.json',encoding='utf-8')); assert r['ok'] is False and r['product_profile_accepted'] is False; assert r['pipeline']['outcome']['status']=='blocked'; assert r.get('diagnostic_audio'); stages={s['name']:s['status'] for s in r['pipeline']['stages']}; assert all(stages.get(n)=='OK' for n in ['_stage_mix_and_sidechain','_stage_mastering','_stage_auto_qa','_stage_release_pack']), stages"
          $checked = $LASTEXITCODE
          if ($checked -ne 0) { $detail = ((Get-Content classic-probe.log | Select-Object -Last 30) -join ' | ') -replace '%','%25'; Write-Output "::error title=Classic pipeline diagnostic regression::$detail" }
          exit $checked
      - name: Measure explicitly requested CPU instrumental without optional texture
        run: python tools/pipeline_hardware_probe.py --duration 20 --without-texture --out output/classic-requested-instrumental
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-classic-pipeline-diagnostic
          path: |
            output/classic-hardware-probe/
            output/classic-requested-instrumental/
            classic-probe.log
          retention-days: 7
          if-no-files-found: error
