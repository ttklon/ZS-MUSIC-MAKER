name: Product plan integrity - Windows
on:
  push:
    branches: ['arena/bbed83d1-zs-music-maker']
    paths:
      - 'docs/plan/**'
      - 'docs/RECIPE_TRANSPORT.md'
      - 'app/core/recipe.py'
      - 'app/core/project_snapshot.py'
      - 'app/cli/task_events.py'
      - 'app/cli/agent_task.py'
      - 'modules/hit_factory/**'
      - 'modules/agent_guide/runner.py'
      - 'tests/test_recipe_transport.py'
      - 'desktop/electron/task*.js'
      - 'desktop/electron/agent-service.js'
      - 'desktop/src/core/task-events.js'
      - 'desktop/test/task*.test.js'
      - 'desktop/test/creation.test.js'
      - 'docs/release/**'
      - 'tools/release_gate.py'
      - 'tests/test_release_gate.py'
      - 'desktop/electron/updater-service.js'
      - 'desktop/test/updater.test.js'
      - 'main.py'
      - 'app/core/entrypoints.py'
      - 'app/core/resource_policy.py'
      - 'app/cli/parser.py'
      - 'app/cli/probes.py'
      - 'agents/sample_hunter/license.py'
      - 'desktop/src/core/journey.js'
      - 'docs/ENTRYPOINTS.md'
      - 'docs/USER_JOURNEY.md'
      - 'docs/RESOURCE_POLICY.md'
      - 'tests/test_product_maps.py'
      - 'app/pipeline/**'
      - 'app/ai/profiles.py'
      - 'app/cli/agent_task.py'
      - 'modules/agent_guide/narration.py'
      - 'desktop/src/sections/creation.js'
      - 'tools/measure_hardware_profile.py'
      - 'tests/test_result_acceptance_contract.py'
      - 'tests/test_task_outcome_contract.py'
      - 'tests/test_hardware_profiles_contract.py'
      - 'docs/PRODUCT.md'
      - 'README.md'
      - 'desktop/src/core/product-contract.js'
      - 'desktop/src/sections/help.js'
      - 'desktop/src/index.html'
      - 'desktop/scripts/product-spec.js'
      - 'desktop/test/product-contract.test.js'
      - 'desktop/electron/window-startup-check.js'
      - 'tools/build_product_plan.py'
      - 'tests/test_product_plan.py'
      - '.github/workflows/product-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-plan-not-product:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check 1000 tasks and dependency graph (not application readiness)
        run: python tools/build_product_plan.py --check
      - name: Install plan test dependency
        run: python -m pip install pytest numpy soundfile
      - name: Observe closed publication gate without publishing
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python tools/release_gate.py --commit "$env:GITHUB_SHA" > "$env:RUNNER_TEMP/release-gate.json"
          if ($LASTEXITCODE -ne 1) { throw 'Expected exactly exit 1 while product acceptance is incomplete' }
          $r = Get-Content "$env:RUNNER_TEMP/release-gate.json" -Raw | ConvertFrom-Json
          if ($r.publication_allowed -ne $false -or $r.reasons.Count -lt 10) { throw 'Missing fail-closed evidence' }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: release-gate-denial
          path: ${{ runner.temp }}/release-gate.json
          retention-days: 7
      - name: Plan and publication contract regression tests only
        run: python -m pytest tests/test_product_plan.py tests/test_release_gate.py tests/test_recipe_transport.py -q

  packaged-product-specification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Product contract and UI regression tests
        run: |
          node desktop/scripts/product-spec.js --check
          node --test desktop/test/product-contract.test.js desktop/test/render.test.js desktop/test/ui-contract.test.js desktop/test/updater.test.js desktop/test/creation.test.js desktop/test/task-stream.test.js desktop/test/task-runner.test.js desktop/test/tasks.test.js desktop/test/agent-bridge.test.js
      - name: Install build tools and Electron
        working-directory: desktop
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Package development application (no release publication)
        working-directory: desktop
        run: npm run dist:dir
      - name: Real packaged help matches product specification
        shell: pwsh
        run: |
          $env:ZSMM_WINDOW_CHECK_OUT = Join-Path $env:RUNNER_TEMP 'product-spec-window.json'
          $p = Start-Process -FilePath 'desktop/dist/win-unpacked/ZS Music Maker.exe' -ArgumentList '--window-check' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Packaged window hung' }
          if (-not (Test-Path $env:ZSMM_WINDOW_CHECK_OUT)) { throw 'Missing window report' }
          Get-Content $env:ZSMM_WINDOW_CHECK_OUT
          $r = Get-Content $env:ZSMM_WINDOW_CHECK_OUT -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.ok) { throw 'Packaged specification check failed' }
          Write-Output '::notice title=Product specification verified::Real packaged Electron: models, settings, help contract and creation. NOT song generation or clean NSIS installation.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-spec-window
          path: ${{ runner.temp }}/product-spec-window.json
          retention-days: 7

  result-outcome-hardware-contracts:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight contract test runtime (no models)
        run: python -m pip install pytest numpy soundfile psutil
      - name: Real WAV contract and canonical outcome regressions
        run: python -m pytest tests/test_result_acceptance_contract.py tests/test_task_outcome_contract.py tests/test_hardware_profiles_contract.py tests/test_product_maps.py -q
      - name: Check read-only CLI entrypoint registry
        run: python main.py --entrypoints
      - name: Inspect resource provenance (incomplete rights are expected)
        shell: pwsh
        run: |
          python main.py --resource-policy
          if ($LASTEXITCODE -ne 1) { throw 'Expected an incomplete resource-rights review, not blanket permission' }
          exit 0
      - name: Measure this runner without claiming inference or GPU support
        run: python tools/measure_hardware_profile.py --out output/contracts/hardware.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-hardware-inventory-not-inference
          path: output/contracts/hardware.json
          retention-days: 7
