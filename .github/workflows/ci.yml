name: ZS-MUSIC-MAKER CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt
        pip install pyloudnorm pedalboard

    - name: Run Pytest Suite
      # Логи job-а из внешних сред не читаются, а имя упавшего шага и его
      # annotation — читаются. Поэтому вывод pytest идёт в файл, из файла
      # берутся строки FAILED, и они попадают в annotation: иначе красный
      # прогон говорит только «exit code 1» и починить его нечем.
      run: |
        status=0
        python -m tools.pytest_isolated tests/ -q > /tmp/pytest.log 2>&1 || status=$?
        tail -60 /tmp/pytest.log
        if [ "$status" -ne 0 ]; then
          detail=$(grep -E '^(FAILED|ERROR)|^E  ' /tmp/pytest.log | head -15 | tr '\n' '|')
          echo "::error title=pytest::$detail"
          exit 1
        fi

    - name: Smoke — audio quality
      run: python tools/smoke_audio.py

    - name: Smoke — God Mode E2E
      run: python tools/smoke_god.py

    - name: Fallback honesty audit
      run: python tools/fallback_audit.py

    - name: CLI sanity (version / list-genres / readiness)
      run: |
        python main.py --version
        python main.py --list-genres
        python main.py --readiness

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt
    - name: Compile all sources
      run: python -m compileall -q app agents modules tools updater ui main.py
    - name: AST dead-imports audit (ШАГ 010)
      run: python tools/ast_dead_imports.py
    - name: Pytest
      run: |
        status=0
        python -m tools.pytest_isolated tests/ -q > /tmp/pytest.log 2>&1 || status=$?
        tail -60 /tmp/pytest.log
        if [ "$status" -ne 0 ]; then
          detail=$(grep -E '^(FAILED|ERROR)|^E  ' /tmp/pytest.log | head -15 | tr '\n' '|')
          echo "::error title=pytest (audit)::$detail"
          exit 1
        fi
    - name: CLI version with config path (ШАГ 007)
      run: python main.py --version

  windows:
    # Цель проекта — Windows 11. Поэтому тесты и полный CPU-прогон идут не только
    # на Ubuntu: проверяем ровно ту платформу, на которой работает владелец.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt

    - name: Compile all sources
      run: python -m compileall -q app agents modules tools updater ui main.py

    - name: Pytest
      shell: bash
      run: |
        status=0
        python -m tools.pytest_isolated tests/ -q -p no:cacheprovider > pytest.log 2>&1 || status=$?
        tail -60 pytest.log
        if [ "$status" -ne 0 ]; then
          detail=$(grep -E '^(FAILED|ERROR)|^E  ' pytest.log | head -15 | tr '\n' '|')
          echo "::error title=pytest (windows)::$detail"
          exit 1
        fi

    - name: Smoke — audio quality
      run: python tools/smoke_audio.py

    - name: CLI sanity (version / list-genres / readiness)
      run: |
        python main.py --version
        python main.py --list-genres
        python main.py --readiness
