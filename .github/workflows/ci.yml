name: ZS-MUSIC-MAKER CI

on:
  push:
    branches: [ main, "genspark/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pyloudnorm pedalboard

    - name: Run Pytest Suite
      run: |
        python -m pytest tests/ -v

    - name: Run smoke_v27 (session regression guard)
      run: |
        python tools/smoke_v27.py

    - name: Run smoke_v26 (audio DSP quality)
      run: |
        python tools/smoke_v26.py

    - name: Run fallback_audit (no red flags allowed)
      run: |
        python tools/fallback_audit.py
