name: ZS-MUSIC-MAKER CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pyloudnorm pedalboard

    - name: Run Pytest Suite
      run: |
        python -m pytest tests/

    # v33 FIX (P1, SESSION_LOG v32.10): раньше CI гонял ТОЛЬКО pytest (7 тестов
    # из 4 файлов) — пуш, ломающий God Mode / аудио-качество / fallback-честность,
    # проходил зелёным. Теперь CI прогоняет реальные регрессионные проверки.
    - name: Smoke — audio quality (v26)
      run: python tools/smoke_v26.py

    - name: Smoke — God Mode E2E (v29)
      run: python tools/smoke_v29.py

    - name: Fallback honesty audit
      run: python tools/fallback_audit.py

    - name: CLI sanity (version / list-genres / readiness)
      run: |
        python main.py --version
        python main.py --list-genres
        python main.py --readiness
