name: Build Windows Executable (God Mode)

on:
  push:
    branches: [ main, "genspark/*" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
        } else {
            pip install numpy scipy soundfile pedalboard audiomentations pyloudnorm requests tqdm
        }

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --console `
          --name "ZSMusicMaker" `
          --add-data "modules;modules" `
          --add-data "app;app" `
          --add-data "docs;docs" `
          --add-data "version.json;." `
          main.py

    - name: Archive Executable
      run: |
        Compress-Archive -Path "dist\ZSMusicMaker" -DestinationPath "ZSMusicMaker-Windows-x64.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZSMusicMaker-Executable
        path: ZSMusicMaker-Windows-x64.zip
