name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (core only — heavy deps optional)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # v36 FIX (P1, SESSION_LOG v32.8): раньше spec не тянул модели/пресеты/промпты
      # (--add-data models отсутствовал), а --hidden-import modules бесполезен
      # для динамических __import__. Теперь используем --collect-submodules
      # для реального включения ленивых импортов, и smoke-шаг больше НЕ
      # continue-on-error: true — падение EXE ломает сборку.
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed ^
            --name "ZS-Music-Maker" ^
            --add-data "version.json;." ^
            --add-data "config;config" ^
            --add-data "data;data" ^
            --add-data "lyric_vault;lyric_vault" ^
            --add-data "voice_vault;voice_vault" ^
            --add-data "models;models" ^
            --collect-submodules modules ^
            --collect-submodules app ^
            --collect-submodules agents ^
            --collect-submodules tools ^
            --collect-submodules ui ^
            --collect-submodules updater ^
            main.py
        shell: cmd

      - name: Smoke-test the built EXE (--version must exit 0)
        run: |
          .\dist\ZS-Music-Maker.exe --version
        shell: cmd

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZS-Music-Maker-Windows-EXE
          path: dist/ZS-Music-Maker.exe
          retention-days: 30

  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ZS-Music-Maker-Windows-EXE
          path: release
      - name: Archive Windows build
        run: cd release && zip -r ../ZS-Music-Maker-Windows.zip .
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ZS-Music-Maker-Windows.zip
