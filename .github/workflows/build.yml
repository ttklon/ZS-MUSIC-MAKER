name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (core only — heavy deps optional)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed ^
            --name "ZS-Music-Maker" ^
            --add-data "version.json;." ^
            --add-data "config;config" ^
            --add-data "data;data" ^
            --add-data "lyric_vault;lyric_vault" ^
            --add-data "voice_vault;voice_vault" ^
            --hidden-import modules ^
            --hidden-import app.core ^
            --hidden-import app.gui ^
            main.py
        shell: cmd

      - name: Smoke-test the built EXE
        run: |
          .\dist\ZS-Music-Maker.exe --version
        shell: cmd
        continue-on-error: true

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZS-Music-Maker-Windows-EXE
          path: dist/ZS-Music-Maker.exe
          retention-days: 30
