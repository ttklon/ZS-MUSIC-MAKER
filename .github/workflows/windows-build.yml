name: ZS Music Maker — Windows EXE Build

on:
  push:
    branches: [ main, "genspark/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload EXE as workflow artifact"
        required: false
        default: "true"

jobs:
  build-windows-exe:
    name: Build Windows EXE (PyInstaller)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Show version info
        shell: pwsh
        run: |
          python --version
          if (Test-Path version.json) { Get-Content version.json }

      - name: Install runtime deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Baseline-безопасный набор: без torch / audiocraft / demucs
          # (heavy engines подтягиваются пользователем локально, не в CI EXE).
          pip install -r requirements.txt
          pip install pyinstaller>=6.6.0

      - name: Sanity run (--version)
        shell: pwsh
        run: |
          python main.py --version

      - name: Run smoke_v27 (session regression guard)
        shell: pwsh
        continue-on-error: true
        run: |
          python main.py --smoke

      - name: PyInstaller build
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --name ZSMusicMaker `
            --onefile `
            --console `
            --collect-submodules modules `
            --collect-submodules app `
            --collect-submodules updater `
            --collect-submodules ui `
            --collect-data librosa `
            --hidden-import=soundfile `
            --hidden-import=pyloudnorm `
            --hidden-import=numpy `
            --hidden-import=scipy `
            --hidden-import=scipy.signal `
            --hidden-import=librosa `
            --add-data "version.json;." `
            --add-data "config;config" `
            --add-data "data;data" `
            main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ZSMusicMaker.exe)) {
            Write-Error "EXE build failed: dist/ZSMusicMaker.exe not found"
            exit 1
          }
          Get-Item dist/ZSMusicMaker.exe | Format-List Name,Length,LastWriteTime
          dist\ZSMusicMaker.exe --version

      - name: Package EXE + docs
        shell: pwsh
        run: |
          $ver = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $stamp = Get-Date -Format "yyyyMMdd-HHmm"
          $zipName = "ZSMusicMaker-v$ver-$stamp-windows.zip"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/ZSMusicMaker.exe release/
          if (Test-Path README.md)  { Copy-Item README.md  release/ }
          if (Test-Path INSTALL.md) { Copy-Item INSTALL.md release/ }
          if (Test-Path LICENSE)    { Copy-Item LICENSE    release/ }
          if (Test-Path version.json) { Copy-Item version.json release/ }
          Compress-Archive -Path release/* -DestinationPath $zipName -Force
          Write-Host "PACKAGED: $zipName"
          Get-Item $zipName | Format-List Name,Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSMusicMaker-windows-exe
          path: |
            dist/ZSMusicMaker.exe
            ZSMusicMaker-*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Release attach (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZSMusicMaker.exe
            ZSMusicMaker-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
