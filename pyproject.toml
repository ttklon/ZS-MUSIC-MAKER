[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zs-music-maker"
version = "38.0.0"
description = "Professional autonomous music creation engine"
readme = "README.md"
requires-python = ">=3.10"
# v33 FIX (P1, SESSION_LOG v32.7): dependencies приведены к ядру
# requirements.txt — раньше pip install . ставил ПОЛОВИНУ окружения
# (не было PySide6/gradio/mido/matplotlib/mutagen/psutil и т.д.).
# Тяжёлые опциональные зависимости (torch/audiocraft/demucs…) намеренно
# НЕ входят — они ставятся install.py с per-package try/except.
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "librosa>=0.10.2",
    "pyloudnorm>=0.1.1",
    "pedalboard>=0.9.0",
    "requests>=2.32.0",
    "gtts>=2.5.0",
    "matchering>=2.0.6",
    "PySide6>=6.7.0",
    "gradio>=4.44.0",
    "matplotlib>=3.8.0",
    "audioread>=3.0.1",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.7",
    "Pillow>=10.0.0",
    "mutagen>=1.47.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "plyer>=2.1.0",
    "mido>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "modules*", "agents*", "ui*", "tools*"]
