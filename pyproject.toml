[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zs-music-maker"
version = "26.0.0"
description = "Professional autonomous music creation engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "pydub",
    "librosa",
    "pyloudnorm",
    "pedalboard",
    "requests",
    "gtts",
    "matchering"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "modules*", "agents*", "ui*", "tools*"]
