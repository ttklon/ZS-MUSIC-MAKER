[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zs-music-maker"
dynamic = ["version"]
description = "Professional autonomous music creation engine"
readme = "README.md"
requires-python = ">=3.10"
# v33 FIX (P1, SESSION_LOG v32.7): dependencies приведены к ядру
# requirements.txt — раньше pip install . ставил ПОЛОВИНУ окружения
# (не было PySide6/gradio/mido/matplotlib/mutagen/psutil и т.д.).
# Тяжёлые опциональные зависимости (torch/audiocraft/demucs…) намеренно
# НЕ входят — они ставятся install.py с per-package try/except.
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "librosa>=0.10.2",
    "pyloudnorm>=0.1.1",
    "pedalboard>=0.9.0",
    "requests>=2.32.0",
    "gtts>=2.5.0",
    "matchering>=2.0.6",
    "PySide6>=6.7.0",
    "gradio>=4.44.0",
    "matplotlib>=3.8.0",
    "audioread>=3.0.1",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.7",
    "Pillow>=10.0.0",
    "mutagen>=1.47.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "plyer>=2.1.0",
    "mido>=1.3.0",
    "cryptography>=42.0.0",
    "audiomentations>=0.33.0",
    "moviepy>=1.0.3,<2.0.0",
    "noisereduce>=3.0.0",
    "lyricsgenius>=3.0.1",
    "mingus>=0.6.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "modules*", "agents*", "ui*", "tools*", "config*"]

[tool.setuptools.dynamic]
version = {attr = "app.version_info.__version__"}

[project.optional-dependencies]
# Зеркало requirements_ai.txt — тяжёлый AI-стек ставится отдельно (install.py).
ai = [
    "llama-cpp-python>=0.2.90",
    "huggingface_hub>=0.24.0",
    "safetensors>=0.4.3",
    "audiocraft>=1.3.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "TTS>=0.22.0",
    "demucs>=4.0.1",
    "faster-whisper>=1.0.3",
    "transformers>=4.44.0",
    "diffusers>=0.30.0",
    "accelerate>=0.33.0",
    "essentia>=2.1b6.dev2",
    "pyAudioAnalysis>=0.3.14",
    "rvc-python>=0.1.0",
    "xformers; platform_system != 'Darwin'",
    "matchering>=2.0.6",
    "bark @ git+https://github.com/suno-ai/bark.git",
]
amd = [
    "torch-directml>=0.2.1.dev240521",
]
